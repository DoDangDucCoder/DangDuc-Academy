services:
  postgres:
    image: postgres:16
    container_name: hdnx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-HDNXUdemy}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - hdnx_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hdnx-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
      redis-server --requirepass "$$REDIS_PASSWORD";
      else
      redis-server;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"

volumes:
  hdnx_postgres_data:
