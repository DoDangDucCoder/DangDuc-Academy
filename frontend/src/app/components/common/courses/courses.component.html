<div class="container" *ngIf="listCourse?.listDataOfContent?.length">
    <div class="title-of-course">
        <h4 class="sub-title"><i class='flaticon-shopping-cart'></i> {{listCourse.nameContent}}</h4>
        <a class="sub-title" routerLink="/categories">Xem thêm</a>
    </div>
    <div class="courses-slides-two">
        <owl-carousel-o [options]="coursesSlides">
            <ng-template carouselSlide *ngFor="let item of listCourse.listDataOfContent">
                <div class="col-lg-12 col-md-12 px-2">
                    <app-course-card
                        [course]="item"
                        routePrefix="/detail-courses"
                        [showAddToCart]="true"
                        [onBookmark]="bookMarkCourse.bind(this)">
                    </app-course-card>
                </div>
            </ng-template>
        </owl-carousel-o>
    </div>
</div>
