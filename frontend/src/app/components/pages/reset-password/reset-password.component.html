<div class="user-area ptb-100">
    <div class="container">
        <div class="user-all-form">
            <div class="reset-password-header">
                <h3>Đặt lại mật khẩu</h3>
                <p>Nhập mã OTP đã gửi đến email <strong>{{ email }}</strong></p>
            </div>
            <div class="form-group">
                <label>Mã OTP (6 chữ số)</label>
                <input type="text" class="form-control border-profile otp-input" [(ngModel)]="otpCode"
                    maxlength="6" placeholder="______" (keyup.enter)="onSubmit()" />
            </div>
            <div class="form-group">
                <label>Mật khẩu mới</label>
                <input type="password" class="form-control border-profile" [(ngModel)]="newPassword"
                    placeholder="Tối thiểu 8 ký tự" />
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" class="form-control border-profile" [(ngModel)]="confirmPassword"
                    placeholder="Nhập lại mật khẩu" (keyup.enter)="onSubmit()" />
            </div>
            <div class="btn-box">
                <a href="javascript:void(0)" class="default-btn with-btn-login" (click)="onSubmit()"
                    [class.disabled]="isLoading">
                    {{ isLoading ? 'Đang xử lý...' : 'Đặt lại mật khẩu' }}<span></span>
                </a>
            </div>
            <p class="mt-3">
                <a routerLink="/forgot-password">Gửi lại mã OTP</a>
            </p>
        </div>
    </div>
</div>
