<div class="page-title-area">
    <div class="container">
        <div class="page-title-content">
            <ul>
                <li><a routerLink="/">Home</a></li>
                <li>Document</li>
            </ul>
            <h2>Documents</h2>
        </div>
    </div>
    <div class="shape9"><img src="assets/img/shape8.svg" alt="image"></div>
</div>

<div class="events-area pt-4 pb-70">
    <div class="container">
        <div class="events-tabs">
            <ul class="nav-tabset">
                <li class="nav-tab" [ngClass]="{'active': currentTab === 'tab1'}">
                    <span (click)="switchTab($event, 'tab1')">
                        All
                    </span>
                </li>
                <li class="nav-tab" [ngClass]="{'active': currentTab === 'tab2'}">
                    <span (click)="switchTab($event, 'tab2')">
                        Phần mềm kỹ thuật
                    </span>
                </li>
                <li class="nav-tab" [ngClass]="{'active': currentTab === 'tab3'}">
                    <span (click)="switchTab($event, 'tab3')">
                        File 2D - 3D
                    </span>
                </li>
                <li class="nav-tab" [ngClass]="{'active': currentTab === 'tab4'}">
                    <span (click)="switchTab($event, 'tab4')">
                        Tài liệu khuôn thước - TLM
                    </span>
                </li>
                <li class="nav-tab" [ngClass]="{'active': currentTab === 'tab5'}">
                    <span (click)="switchTab($event, 'tab5')">
                        Tài liệu gia công lập trình - TLCNC
                    </span>
                </li>
            </ul>
            <div class="tabs-container">
                <div class="pane" [id]="currentTab">
                    <div class="row">
                        <div class="col-lg-3 col-sm-6 col-md-6" *ngFor="let doc of getDocumentsByTab(currentTab)">
                            <div class="single-events-box">
                                <div class="image">
                                    <a routerLink="/single-events" class="d-block">
                                        <img [src]="doc.image" [alt]="doc.title">
                                    </a>
                                    <span class="date">{{ doc.date }}</span>
                                </div>
                                <div class="content">
                                    <h3 style="font-size: 18px;"><a routerLink="/single-events">{{ doc.title }}</a></h3>
                                    <a class="location" href="#"><i class='bx bxs-cloud-download'></i>Tải tài liệu</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="subscribe-area bg-f9f9f9 ptb-100">
    <div class="container">
        <app-subscribe></app-subscribe>
    </div>
    <div class="shape4"><img src="assets/img/shape4.png" alt="image"></div>
    <div class="shape13"><img src="assets/img/shape12.png" alt="image"></div>
    <div class="shape14"><img src="assets/img/shape13.png" alt="image"></div>
    <div class="shape15"><img src="assets/img/shape14.png" alt="image"></div>
</div>
