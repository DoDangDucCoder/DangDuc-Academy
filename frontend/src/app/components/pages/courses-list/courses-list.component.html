<div class="page-title-area">
    <div class="container">
        <div class="page-title-content">
            <ul>
                <li><a routerLink="/">Home</a></li>
                <li>Danh sách khóa học</li>
            </ul>
            <h2>Khóa Học</h2>
        </div>
    </div>
    <div class="shape9"><img src="assets/img/shape8.svg" alt="image" /></div>
</div>

<app-hdnx-loading [show]="isLoading">
    <div class="courses-area pt-50 pb-100">
        <div class="container pt-4">
            <div class="odemy-grid-sorting row align-items-center">
                <div class="col-lg-6 col-md-6 result-count">
                    <p>Tìm thấy <span class="count">{{listCourses.length}}</span> khóa học</p>
                </div>
                <div class="col-lg-6 col-md-6 ordering">
                    <div class="select-box">
                        <label>Sắp xếp:</label>
                        <select>
                            <option>Mặc định</option>
                            <option>Phổ biến nhất</option>
                            <option>Mới nhất</option>
                            <option>Giá: Thấp đến Cao</option>
                            <option>Giá: Cao đến Thấp</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row g-4 mt-2">
                <div class="col-xl-3 col-lg-4 col-md-6" *ngFor="let item of listCourses">
                    <app-course-card
                        [course]="item"
                        routePrefix="/detail-courses"
                        [showAddToCart]="true">
                    </app-course-card>
                </div>

                <div class="col-lg-12 col-md-12">
                    <div class="pagination-area text-center">
                        <pagination nextText="Next Page" previousText="Previous Page"
                            class="pagination-wrap hstack justify-content-center gap-2"
                            [totalItems]="listCourses?.length"
                            [itemsPerPage]="10"
                            (pagrChanged)="pageChanged($event)">
                        </pagination>
                    </div>
                </div>
            </div>
        </div>
    </div>
</app-hdnx-loading>
