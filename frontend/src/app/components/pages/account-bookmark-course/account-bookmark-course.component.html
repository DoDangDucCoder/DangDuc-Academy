<!-- Page Banner -->
<div class="inner-banner inner-bg5">
    <div class="container">
        <div class="inner-title text-center">
            <h1>Khóa Học Đã Lưu</h1>
            <ul>
                <li><a routerLink="/"> Home </a></li>
                <li>Bookmark Course</li>
            </ul>
            <div class="inner-shape">
                <img src="assets/images/inner-banner/inner-shape1.png" alt="shape" />
                <img src="assets/images/inner-banner/inner-shape2.png" alt="shape" />
            </div>
        </div>
    </div>
</div>

<div class="author-profile-area ptb-100">
    <div class="container">
        <div class="row">
            <!-- Sidebar profile -->
            <div class="col-xl-3 col-lg-4 col-md-12">
                <div class="author-profile-sidebar">
                    <div class="author-user">
                        <img [src]="user.pictureUrl | assetUrl:'assets/images/demo/avatar-placeholder.svg'" fallbackSrc="/assets/images/demo/avatar-placeholder.svg" alt="author" />
                        <i class="bx bx-check-shield"></i>
                    </div>
                    <h3>{{user.name}}</h3>
                    <span>{{user.email}}</span>
                    <p>{{user.phone}}</p>
                    <div class="sp-title">HDNX {{user.userId}} <i class="ri-folders-line"></i></div>
                    <div class="author-content">
                        <div class="content-left">
                            <span>Follow</span>
                            <h3>2941</h3>
                        </div>
                        <div class="content-right">
                            <button type="submit">Follow</button>
                        </div>
                    </div>
                    <ul class="social-link">
                        <li><a href="https://www.facebook.com/" target="_blank" class="facebook"><i class="bx bxl-facebook-circle"></i></a></li>
                        <li><a href="https://twitter.com/" target="_blank" class="twitter"><i class="bx bxl-twitter"></i></a></li>
                        <li><a href="https://www.linkedin.com/" target="_blank" class="linkedin"><i class="bx bxl-linkedin-square"></i></a></li>
                        <li><a href="https://www.instagram.com/" target="_blank" class="instagram"><i class="bx bxl-instagram"></i></a></li>
                    </ul>
                </div>
            </div>

            <!-- Course grid -->
            <div class="col-xl-9 col-lg-8 col-md-12">
                <div class="row g-4">
                    <div class="col-xl-4 col-lg-4 col-md-6" *ngFor="let item of course">
                        <app-course-card
                            [course]="item"
                            routePrefix="/detail-courses"
                            [showAddToCart]="true"
                            [onAddToCart]="addCourseToCart.bind(this)">
                        </app-course-card>
                    </div>

                    <div class="col-12" *ngIf="!course?.length">
                        <div class="text-center py-5 text-muted">
                            <i class="bx bx-bookmark" style="font-size:3rem;opacity:.3"></i>
                            <p class="mt-2">Chưa có khóa học nào được lưu.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
