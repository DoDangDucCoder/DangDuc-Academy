<div class="page-title-area">
    <div class="container">
        <div class="page-title-content">
            <ul>
                <li><a routerLink="/">Home</a></li>
                <li>News</li>
            </ul>
            <h2>News</h2>
        </div>
    </div>
    <div class="shape9"><img src="assets/img/shape8.svg" alt="image"></div>
</div>

<div class="blog-area ptb-100">
    <div class="container">
        <div class="row">
            <div class="col-xxl-3 col-lg-3 col-md-6" *ngFor="let article of articles">
                <div class="single-blog-post-box">
                    <div class="post-image">
                        <a [routerLink]="['/detail-news', article.slug]" class="d-block">
                            <img [src]="article.thumbnailUrl || 'https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=700&q=80'" [alt]="article.title">
                        </a>
                    </div>
                    <div class="post-content">
                        <a [routerLink]="['/news']" class="category">News</a>
                        <h3><a [routerLink]="['/detail-news', article.slug]">{{ article.title }}</a></h3>
                        <p style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; color: #666; margin-bottom: 15px; font-size: 14px;">{{ article.description }}</p>
                        <ul class="post-content-footer d-flex justify-content-between align-items-center">
                            <li>
                                <div class="post-author d-flex align-items-center">
                                    <img src="assets/img/user1.jpg" class="rounded-circle" alt="image">
                                    <span>{{ article.authorName || 'Admin' }}</span>
                                </div>
                            </li>
                            <li><i class='flaticon-calendar'></i> {{ article.createDate | date:'MMM dd, yyyy' }}</li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-12 col-md-12" *ngIf="totalPages() > 1">
                <div class="pagination-area text-center">
                    <a href="javascript:void(0)" class="prev page-numbers" (click)="onPageChange(currentPage - 1)" [class.disabled]="currentPage === 1"><i class='bx bx-chevrons-left'></i></a>
                    
                    <a href="javascript:void(0)" class="page-numbers" *ngFor="let page of getPages()" [class.current]="currentPage === page" (click)="onPageChange(page)">{{page}}</a>
                    
                    <a href="javascript:void(0)" class="next page-numbers" (click)="onPageChange(currentPage + 1)" [class.disabled]="currentPage === totalPages()"><i class='bx bx-chevrons-right'></i></a>
                </div>
            </div>
        </div>
    </div>
</div>
