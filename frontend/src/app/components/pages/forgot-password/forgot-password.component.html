<div class="user-area ptb-100">
    <div class="container">
        <div class="user-all-form">
            <div class="forgot-password-header">
                <h3>Quên mật khẩu</h3>
                <p>Nhập email đã đăng ký để nhận mã xác nhận</p>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-control border-profile" [(ngModel)]="email"
                    placeholder="Nhập email của bạn" (keyup.enter)="onSubmit()" />
            </div>
            <div class="btn-box">
                <a href="javascript:void(0)" class="default-btn with-btn-login" (click)="onSubmit()"
                    [class.disabled]="isLoading">
                    {{ isLoading ? 'Đang gửi...' : 'Gửi mã xác nhận' }}<span></span>
                </a>
            </div>
            <p class="mt-3">
                Đã nhớ mật khẩu?
                <a routerLink="/login">Đăng nhập</a>
            </p>
        </div>
    </div>
</div>
