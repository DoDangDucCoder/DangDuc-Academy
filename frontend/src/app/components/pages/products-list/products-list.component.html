<div class="page-title-area">
    <div class="container">
        <div class="page-title-content">
            <ul>
                <li><a routerLink="/">Home</a></li>
                <li>Products</li>
            </ul>
            <h2>Shop</h2>
        </div>
    </div>
    <div class="shape9"><img src="assets/img/shape8.svg" alt="image"></div>
</div>

<div class="products-area pt-4 pb-4">
    <div class="container with-btn-login">
        <div class="odemy-grid-sorting row align-items-center">
            <div class="col-lg-6 col-md-6 result-count">
                <p>We found <span class="count">{{ products.length }}</span> products available for you</p>
            </div>
            <div class="col-lg-6 col-md-6 ordering">
                <div class="select-box">
                    <label>Sort By:</label>
                    <select>
                        <option>Default</option>
                        <option>Popularity</option>
                        <option>Latest</option>
                        <option>Price: low to high</option>
                        <option>Price: high to low</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-3 col-md-6 col-sm-6" *ngFor="let p of visibleProducts">
                <div class="single-products-box">
                    <div class="products-image">
                        <a routerLink="/details-products">
                            <img [src]="p.image" class="main-image" [alt]="p.name">
                        </a>
                        <div class="sale-tag" *ngIf="p.isSale">Sale!</div>
                        <div class="new-tag" *ngIf="p.isNew">New!</div>
                    </div>
                    <div class="products-content">
                        <h3><a routerLink="/details-products">{{ p.name }}</a></h3>
                        <div class="price">
                            <span class="old-price" *ngIf="p.oldPrice">{{ p.oldPrice | currency:'VND':'symbol' }}</span>
                            <span class="new-price">{{ p.newPrice | currency:'VND':'symbol' }}</span>
                        </div>
                        <div class="star-rating">
                            <i class='bx bxs-star'></i>
                            <i class='bx bxs-star'></i>
                            <i class='bx bxs-star'></i>
                            <i class='bx bxs-star'></i>
                            <i class='bx bxs-star'></i>
                        </div>
                        <a routerLink="/cart" class="add-to-cart">Add to cart</a>
                    </div>
                </div>
            </div>
            <div class="col-lg-12 col-md-12 col-sm-12">
                <nav class="pagination-area text-center" aria-label="Product pages" *ngIf="totalPages > 1">
                    <a *ngIf="currentPage > 1" routerLink="/products" [queryParams]="{page: currentPage - 1}" class="prev page-numbers" aria-label="Previous page"><i class="bx bx-chevrons-left" aria-hidden="true"></i></a>
                    <span *ngIf="currentPage === 1" class="prev page-numbers disabled" aria-disabled="true"><i class="bx bx-chevrons-left" aria-hidden="true"></i></span>
                    <a *ngFor="let page of pages" routerLink="/products" [queryParams]="{page: page}" class="page-numbers" [class.current]="page === currentPage" [attr.aria-current]="page === currentPage ? 'page' : null">{{ page }}</a>
                    <a *ngIf="currentPage < totalPages" routerLink="/products" [queryParams]="{page: currentPage + 1}" class="next page-numbers" aria-label="Next page"><i class="bx bx-chevrons-right" aria-hidden="true"></i></a>
                    <span *ngIf="currentPage === totalPages" class="next page-numbers disabled" aria-disabled="true"><i class="bx bx-chevrons-right" aria-hidden="true"></i></span>
                </nav>
            </div>
        </div>
    </div>
</div>
