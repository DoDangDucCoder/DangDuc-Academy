<!-- Login -->
<app-hdnx-loading [show]="isLoading">
    <div class="user-area ptb-100">
        <div class="container">
            <div class="user-all-form">
                <form [formGroup]="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="text" class="form-control border-profile" formControlName="email" />
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <input class="form-control" type="password" name="password" formControlName="password" />
                    </div>
                    <div class="btn-box">
                        <a href="javascript:void(0)" class="default-btn with-btn-login" (click)="loginWithEmail()">Đăng nhập<span></span></a>
                    </div>
                    <div class="sub-title">
                        <span>Đăng nhập mạng xã hội chưa được cấu hình cho môi trường local.</span>
                    </div>
                    <p>
                        Bạn chưa có tài khoản?
                        <a routerLink="/register">Tạo tài khoản</a>
                    </p>
                    <p>
                        <a routerLink="/forgot-password">Quên mật khẩu?</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

</app-hdnx-loading>
