apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5194
      targetPort: 5194
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/hdnxudemy/backend-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5194
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: hdnx-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hdnx-secrets
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgres;Port=5432;Database=HDNXUdemy;Username=postgres;Password=$(POSTGRES_PASSWORD)"
            - name: Elasticsearch__Url
              valueFrom:
                configMapKeyRef:
                  name: hdnx-config
                  key: ELASTICSEARCH_URL
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5194
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5194
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
