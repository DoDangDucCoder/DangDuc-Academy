apiVersion: v1
kind: Service
metadata:
  name: video-api
spec:
  selector:
    app: video-api
  ports:
    - name: http
      port: 5195
      targetPort: 5195
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: video-api
  template:
    metadata:
      labels:
        app: video-api
    spec:
      containers:
        - name: video-api
          image: ghcr.io/hdnxudemy/video-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5195
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5195
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5195
            initialDelaySeconds: 30
            periodSeconds: 30
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: hdnx-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hdnx-secrets
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgres;Port=5432;Database=HDNXUdemy;Username=postgres;Password=$(POSTGRES_PASSWORD)"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
