apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hdnx-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  tls:
    - hosts:
        - web-hdnx.example.com
        - admin-hdnx.example.com
        - video-hdnx.example.com
      secretName: hdnx-production-tls
