apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: staging-

images:
  - name: ghcr.io/hdnxudemy/backend-api
    newName: ghcr.io/hdnxudemy/backend-api
    newTag: staging
  - name: ghcr.io/hdnxudemy/video-api
    newName: ghcr.io/hdnxudemy/video-api
    newTag: staging
  - name: ghcr.io/hdnxudemy/frontend
    newName: ghcr.io/hdnxudemy/frontend
    newTag: staging
  - name: ghcr.io/hdnxudemy/admin
    newName: ghcr.io/hdnxudemy/admin
    newTag: staging

patches:
  - path: replicas.yaml
  - path: ingress.yaml
