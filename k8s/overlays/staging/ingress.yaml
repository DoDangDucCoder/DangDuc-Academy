apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hdnx-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  tls:
    - hosts:
        - staging-web-hdnx.example.com
        - staging-admin-hdnx.example.com
        - staging-video-hdnx.example.com
      secretName: staging-hdnx-tls
  rules:
    - host: staging-web-hdnx.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5194
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: staging-admin-hdnx.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5194
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 80
    - host: staging-video-hdnx.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: video-api
                port:
                  number: 5195
